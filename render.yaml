# Render Blueprint — https://render.com/docs/blueprint-spec
# New > Blueprint > pick this repo. You'll be asked for the values marked sync: false.
services:
  - type: web
    name: arpeggio
    runtime: python
    plan: free            # sleeps after 15 min idle; upgrade to "starter" to keep it always on
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY            # signs login cookies
        generateValue: true
      - key: ARPEGGIO_TZ
        value: Asia/Manila
      - key: GOOGLE_SHEET_ID       # the long ID in the sheet's URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON   # paste the whole service-account key file
        sync: false
      - key: ARPEGGIO_ADMIN_PASSWORD       # password for the first "admin" login
        sync: false
