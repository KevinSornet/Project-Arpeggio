<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In · Arpeggio</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand"><span class="brand-mark">A</span> ARPEGGIO</div>
      <h1 style="margin-top:18px">Sign in</h1>
      <p class="muted" style="margin:4px 0 0">Vehicle release pipeline</p>
      <form id="loginForm">
        <label>Username<input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <div class="error" id="err" role="alert"></div>
        <button class="primary" type="submit" style="justify-content:center">Sign in</button>
      </form>
      <p class="muted" style="font-size:12px;margin:16px 0 0">No account or forgot your password? Ask your Arpeggio admin.</p>
    </div>
  </div>
  <script src="/common.js"></script>
  <script src="/login.js"></script>
</body>
</html>
